<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#72c7ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flappy Retro">
<link rel="manifest" href="manifest.webmanifest">
<title>Flappy Retro</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:system-ui,-apple-system,sans-serif;touch-action:none}
body{display:flex;align-items:center;justify-content:center}
canvas{height:100dvh;width:auto;max-width:100vw;display:block;background:#72c7ff}
#hint{position:fixed;bottom:10px;left:0;right:0;text-align:center;color:#fff8;font-size:12px;pointer-events:none}
</style>
</head>
<body>
<canvas id="game" width="400" height="700"></canvas>
<div id="hint">Tap anywhere to flap</div>
<script src="game.js"></script>
<script>
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
