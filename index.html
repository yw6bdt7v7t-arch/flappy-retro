<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#72c8f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flappy Retro">
<link rel="manifest" href="manifest.webmanifest">
<title>Flappy Retro</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0e1520}
body{display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;touch-action:none}
#game{width:min(100vw,56.25vh);height:100dvh;max-height:none;display:block;touch-action:none}
@media (min-aspect-ratio:9/16){#game{height:100dvh;width:auto}}
</style>
</head>
<body>
<canvas id="game" width="450" height="800"></canvas>
<script src="game.js"></script>
<script>
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js?v=3").catch(()=>{});
</script>
</body>
</html>
